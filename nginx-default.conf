server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Deliberately no custom types{} block -- see qwickapps/infrastructure#106
    # for why: it silently replaces (not extends) nginx's default mime.types
    # map, breaking Content-Type for every asset. Base image defaults
    # already cover html/js/json/wasm/png correctly; .onnx correctly falls
    # back to default_type application/octet-stream (binary fetch, never
    # rendered).

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* ^/(models|vendor)/.*\.(onnx|json|txt|js|bin|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
